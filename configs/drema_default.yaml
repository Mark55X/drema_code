# ==============================================================================
# DREMA Dynamic System Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System, Networking & Web Visualization
# ------------------------------------------------------------------------------
system:
  device: "auto"                    # Computation device ("auto", "cuda", or "cpu")
  grpc_port: 50051                  # gRPC server port for simulation environment / real robot
  viser:
    enabled: true                   # Launch real-time 3D Viser Web Visualizer
    port: 8080                      # Web visualizer port (http://localhost:8080)
    update_decimation: 3            # Push to Viser every N perception steps
    max_splats: 50000               # Max Gaussians displayed in web browser for responsive 60fps

# ------------------------------------------------------------------------------
# 2. Client & Networking Calibration (Local vs SSH Tunnel)
# ------------------------------------------------------------------------------
communication:
  client:
    ping_timeout_s: 1.5             # gRPC ping timeout (high enough to prevent false disconnects over SSH jump proxies)
    ping_max_retries: 3             # Consecutive failed pings before declaring server disconnected
    scan_chunk_size: 2              # Number of views per chunk transmission (halves message size for SSH stability)
    scan_chunk_timeout_s: 180.0     # Generous timeout per chunk over SSH jump proxy
    cam_resolution: [256, 256]      # Online dynamic streaming camera resolution [width, height]

# ------------------------------------------------------------------------------
# 3. Perception & 3D Dynamic Reconstruction Pipeline
# ------------------------------------------------------------------------------
perception:
  module: "vg_mapping_recurgs"       # Perception backend identifier ("vg_mapping_recurgs")
  frequency_hz: 10.0                 # Target perception / dynamic tracking loop rate (Hz)
  queue_max_size: 5                  # Max camera observation queue size (prevents frame latency lag)
  voxel_size: 0.01                   # TSDF volumetric grid resolution in meters (0.01 = 1cm)

  # Diagnostics & Timing Breakdown
  diagnostics:
    log_interval_frames: 10          # Print [VG MAPPING PERCEPTION] detailed timing breakdown every N frames
    enable_timing_breakdown: true    # Profile Step 1 (TSDF), Step 2 (VDC), Step 3 (SE3 Tracking)

  # Workspace & Table Segmentation Priors
  workspace:
    table_z_prior: 0.75              # Prior guess for tabletop elevation in meters
    reachability_radius: 0.95        # Franka Panda reachability radius in meters
    robot_base_radius: 0.13          # Exclusion cylinder radius around robot base in meters
    obstacle_min_clearance_z: 0.015  # Minimum clearance above table to isolate objects from surface noise
    workspace_margin: 0.05           # Lateral safety expansion margin for workspace TSDF bounds in meters
    table_thickness: 0.05            # Estimated vertical thickness below tabletop surface in meters
    table_bounds_fallback: [-0.50, 1.10, -0.55, 0.55] # Fallback horizontal table bounds [xmin, xmax, ymin, ymax]
    # Semantic keyword filters for CoppeliaSim object classification
    robot_keywords: ["panda", "link", "finger", "hand", "joint", "arm", "gripper", "wrist", "flange"]
    background_keywords: [
      "workspace", "table", "floor", "wall", "ceiling", "pillar",
      "sensor", "success", "camera", "head", "waypoint", "detector",
      "target", "goal", "marker", "dummy"
    ]
    virtual_keywords: ["target", "goal", "marker", "dummy", "waypoint", "detector", "sensor", "success"]

  # Online Raycast Pruning & VDC Mapping
  mapping:
    closed_loop_avd: true            # Enable closed-loop 3DGS rendering + AVD variation detection (paper Section III-B)
    raycast_stride: 2                # Pixel stride for raycast pruning (2 = 2x subsampled, ~4x faster pruning)
    raycast_steps: null              # Raycast depth sampling steps (null = automatic sub-voxel resolution)
    tau_s: 0.35                      # SSIM appearance variation detection threshold (0.35 robust to real-time render noise)
    tau_p: 0.2                       # Pruning TSDF surface threshold (paper Section III-B.2: tau_p = 0.2)
    tau_w: 1.0                       # Geometry variation weight threshold (voxels with W <= tau_w trigger GVD)
    max_weight: 10.0                 # Max TSDF weight clamp (allows stable accumulation W > tau_w to prevent static churn)
    safety_margin_factor: 1.0        # Stopping distance factor for raycast pruning (paper Eq. 17: 1.0 * voxel_size = 1cm)

    # Dynamic Object Semantic Mesh Extraction (DREMA Architecture)
    object_mesh_voxel_size: 0.005    # Voxel length for object TSDF integration (5mm fine resolution)
    object_mesh_sdf_trunc: 0.02      # TSDF truncation margin for object reconstruction (2cm)
    object_mesh_max_weight: 15.0     # Max TSDF weight clamp for object mesh reconstruction
    depth_near: 0.1                  # Minimum valid camera sensor depth in meters
    depth_far: 3.0                   # Maximum valid camera sensor depth in meters
    taubin_iterations: 3             # Number of Taubin smoothing iterations (0 to disable)

  # 3D Gaussian Splatting & Normal-Guided Anisotropic Covariances
  gaussians:
    scale_tangent_min: 0.012         # Min radius across surface tangent plane (meters) to seal voxel gaps
    scale_normal_min: 0.003          # Min thickness through surface normal (meters)
    opacity_init: 0.95               # Initial opacity for reconstructed surface primitives

  # Photometric SGD Optimization (VG-Mapping Paper Sec. III-B.3, Eq. 10)
  sgd:
    enabled: false                   # When True, executes Adam optimization over photometric loss L1 + SSIM
    steps: 5                         # Number of SGD steps per frame (default: 5, set to 0 for pure feedforward)
    lr_color: 0.01                   # Learning rate for RGB/spherical harmonic color
    lr_opacity: 0.05                 # Learning rate for Gaussian opacity
    lambda_ssim: 0.2                 # Weight for SSIM loss (paper Eq. 10: lambda = 0.2)
    prune_opacity_threshold: 0.05    # Opacity threshold below which Gaussians are pruned

  # RecurGS SE(3) Rigid Object Tracking (Calibrate for GPU balance with MuJoCo controller)
  tracking:
    se3_iterations: 12               # Lie algebra gradient optimization iterations per frame
    se3_icp_iterations: 8            # Coarse ICP alignment iterations
    subsample: 256                   # Subsampled points per object (increase to 512/1024 for higher accuracy)
    learning_rate: 0.003             # Step size in se(3) tangent space
    tolerance: 0.0001                # Convergence criterion
    proximity_search_radius: 0.25    # Bounding sphere search radius around last known position in meters

  # Initial Scan (t=0) Caching (Instant restoration in <0.1s without re-streaming over SSH)
  cache:
    enabled: true                    # When True, attempts instant restore of t=0 scan from disk
    save_on_scan: true               # When True, saves t=0 scan tensors and meshes to disk
    cache_dir: "cache/scene_init"    # Directory where scene_gaussians.pt, tsdf.pt, meshes are stored

# ------------------------------------------------------------------------------
# 4. Digital Twin Engine
# ------------------------------------------------------------------------------
digital_twin:
  engine: "pybullet"                 # Physics engine backend: "pybullet" or "mujoco"
  enable_mjx: false                  # Enable MJX GPU-accelerated parallel rollout bridge for MuJoCo
  gui: true                          # Show native physics visualizer window (GLFW for MuJoCo, OpenGL for PyBullet)

  time_step: 0.002                   # Physics simulation time step in seconds
  urdf_path: "franka_panda/panda.urdf"                      # Calibrated URDF for PyBullet backend (neutral 0,0,0 base)
  mujoco_model_path: "assets/franka_panda/panda.xml"        # MJCF XML for MuJoCo backend
  tracking_mode: "constraint"        # "constraint" (6-DoF constraint / MuJoCo mocap-weld), "pd_force", or "teleport"
  constraint_max_force: 300.0        # Maximum force for 6-DoF constraint (N)
  kp_pos: 250.0                      # Proportional gain for PD position tracking (N/m)
  kd_pos: 30.0                       # Derivative gain for PD velocity damping (N*s/m)
  kp_rot: 15.0                       # Proportional gain for PD orientation tracking (N*m/rad)
  kd_rot: 1.5                        # Derivative gain for PD angular velocity damping (N*m*s/rad)
  sim_substeps: 2                    # Micro-steps per simulation step for high contact stability

# ------------------------------------------------------------------------------
# 5. Controller (MP-PMPPI / Future GPU MuJoCo Rollouts)
# ------------------------------------------------------------------------------
controller:
  engine: "mp_pmppi"                 # Controller architecture
  frequency_hz: 20.0                 # Control execution and planning frequency (Hz)
  dt: 0.05                           # MPPI prediction time step dt (seconds)
  horizon: 15                        # MPPI prediction horizon H (15 * 0.05s = 0.75s)
  max_joint_velocity: 0.50           # Maximum joint velocity execution limit (rad/s)
  max_joint_acc: 0.50                # Joint acceleration saturation limit (rad/s^2)
  num_samples_per_planner: 24        # Stochastic samples per MPPI strategy
  top_k: 12                          # Top candidates evaluated by the Judge
  alpha_pos: 1.0                     # Cartesian position tracking weight (Zhou et al. Eq. 27)
  alpha_rot: 0.25                    # Cartesian orientation tracking weight (Zhou et al. Eq. 27)
  log_interval_actions: 10           # Telemetry print interval for served control actions (every N actions)
  sigma_1: 0.02                      # Inscribed hard safety collision margin [m]
  sigma_2: 0.05                      # Inflation radius [m] - calibrated for dense tabletop manipulation (was 0.08)
  kappa: 15.0                        # Descending potential slope (Zhou et al. Eq. 21)
  adaptive_goal_margin: false        # Strict adherence to Zhou et al. Eq. 21 without ad-hoc tapering heuristics
  # Dynamic Collision Evasion Thresholds (TTC / Approach velocity aware)
  evade_min_distance: 0.01           # Min distance threshold to avoid numerical singularities [m]
  evade_max_distance: 0.35           # Max search radius for evasive obstacle tracking [m]
  evade_ttc_threshold: 2.0           # Time-to-Collision threshold to trigger active evasion [s]
  evade_min_speed: 0.03              # Speed threshold to classify obstacle as dynamic [m/s]
  evade_imminent_distance: 0.06      # Immediate physical proximity margin triggering evasion [m]
  evade_retreat_speed: 0.15          # Linear retreat speed for evasive maneuvers [m/s]
  evade_lift_speed: 0.12             # Upward vertical lift component for evade_over [m/s]

