# ==============================================================================
# DREMA Dynamic System Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System, Networking & Web Visualization
# ------------------------------------------------------------------------------
system:
  device: "auto"                    # Computation device ("auto", "cuda", or "cpu")
  grpc_port: 50051                  # gRPC server port for simulation environment / real robot
  viser:
    enabled: true                   # Launch real-time 3D Viser Web Visualizer
    port: 8080                      # Web visualizer port (http://localhost:8080)
    update_decimation: 3            # Push to Viser every N perception steps
    max_splats: 50000               # Max Gaussians displayed in web browser for responsive 60fps

# ------------------------------------------------------------------------------
# 2. Client & Networking Calibration (Local vs SSH Tunnel)
# ------------------------------------------------------------------------------
communication:
  client:
    ping_timeout_s: 1.5             # gRPC ping timeout (high enough to prevent false disconnects over SSH jump proxies)
    ping_max_retries: 3             # Consecutive failed pings before declaring server disconnected
    scan_chunk_size: 2              # Number of views per chunk transmission (halves message size for SSH stability)
    scan_chunk_timeout_s: 180.0     # Generous timeout per chunk over SSH jump proxy
    cam_resolution: [256, 256]      # Online dynamic streaming camera resolution [width, height]

# ------------------------------------------------------------------------------
# 3. Perception & 3D Dynamic Reconstruction Pipeline
# ------------------------------------------------------------------------------
perception:
  module: "vg_mapping_recurgs"       # Perception backend identifier ("vg_mapping_recurgs")
  frequency_hz: 10.0                 # Target perception / dynamic tracking loop rate (Hz)
  queue_max_size: 5                  # Max camera observation queue size (prevents frame latency lag)
  voxel_size: 0.01                   # TSDF volumetric grid resolution in meters (0.01 = 1cm)

  # Diagnostics & Timing Breakdown
  diagnostics:
    log_interval_frames: 10          # Print [VG MAPPING PERCEPTION] detailed timing breakdown every N frames
    enable_timing_breakdown: true    # Profile Step 1 (TSDF), Step 2 (VDC), Step 3 (SE3 Tracking)

  # Workspace & Table Segmentation Priors
  workspace:
    table_z_prior: 0.75              # Prior guess for tabletop elevation in meters
    reachability_radius: 0.95        # Franka Panda reachability radius in meters
    robot_base_radius: 0.13          # Exclusion cylinder radius around robot base in meters
    obstacle_min_clearance_z: 0.015  # Minimum clearance above table to isolate objects from surface noise
    workspace_margin: 0.05           # Lateral safety expansion margin for workspace TSDF bounds in meters
    table_thickness: 0.05            # Estimated vertical thickness below tabletop surface in meters
    table_bounds_fallback: [-0.50, 1.10, -0.55, 0.55] # Fallback horizontal table bounds [xmin, xmax, ymin, ymax]
    # Fallback only: the environment sends a category per label (robot / object / background) and these name keyword
    # filters classify the labels of an environment that sends none. Physical task objects are kept whatever their
    # name (RLBench calls the object to manipulate "*_target"); only non-physical helpers are virtual: name visual-only
    # markers "*_marker" to keep them out of the reconstruction.
    robot_keywords: ["panda", "link", "finger", "hand", "joint", "arm", "gripper", "wrist", "flange"]
    background_keywords: [
      "workspace", "table", "floor", "wall", "ceiling", "pillar",
      "sensor", "success", "camera", "head", "waypoint", "detector",
      "marker", "dummy"
    ]
    virtual_keywords: ["marker", "dummy", "waypoint", "detector", "sensor", "success"]

  # Online Raycast Pruning & VDC Mapping
  mapping:
    closed_loop_avd: true            # Enable closed-loop 3DGS rendering + AVD variation detection (paper Section III-B)
    raycast_stride: 2                # Pixel stride for raycast pruning (2 = 2x subsampled, ~4x faster pruning)
    raycast_steps: null              # Raycast depth sampling steps (null = automatic sub-voxel resolution)
    tau_s: 0.35                      # SSIM appearance variation detection threshold (0.35 robust to real-time render noise)
    tau_p: 0.2                       # Pruning TSDF surface threshold (paper Section III-B.2: tau_p = 0.2)
    tau_w: 1.0                       # Geometry variation weight threshold (voxels with W <= tau_w trigger GVD)
    max_weight: 10.0                 # Max TSDF weight clamp (allows stable accumulation W > tau_w to prevent static churn)
    safety_margin_factor: 1.0        # Stopping distance factor for raycast pruning (paper Eq. 17: 1.0 * voxel_size = 1cm)

    # Dynamic Object Semantic Mesh Extraction (DREMA Architecture)
    object_mesh_voxel_size: 0.005    # Voxel length for object TSDF integration (5mm fine resolution)
    object_mesh_sdf_trunc: 0.01      # TSDF truncation margin for object reconstruction (1cm = 2 voxels)
    object_mesh_max_weight: 15.0     # Max TSDF weight clamp for object mesh reconstruction
    object_mesh_responsive_weights: false  # VG-Mapping responsive negative weight (Eq. 4) in the object scan; false = multi-view average (the t=0 scene is static)
    object_mesh_free_space_carving: true   # Pixels of other surfaces mark the space in front of what they hit as empty (no band spreading past the silhouette)
    object_mesh_carving_margin: 0.0        # Distance [m] in front of the hit a voxel must be to be carved: the depth noise (0 for simulated depth, a few mm on a real sensor)
    object_mesh_table_bound: true          # Objects resting on the detected table plane are bounded by it (nothing of them below the table)
    depth_near: 0.1                  # Minimum valid camera sensor depth in meters
    depth_far: 3.0                   # Maximum valid camera sensor depth in meters
    taubin_iterations: 3             # Number of Taubin smoothing iterations on the object meshes (0 to disable)

  # 3D Gaussian Splatting & Normal-Guided Anisotropic Covariances
  gaussians:
    scale_tangent_min: 0.012         # Min radius across surface tangent plane (meters) to seal voxel gaps
    scale_normal_min: 0.003          # Min thickness through surface normal (meters)
    opacity_init: 0.95               # Initial opacity for reconstructed surface primitives

  # Photometric SGD Optimization (VG-Mapping Paper Sec. III-B.3, Eq. 10)
  sgd:
    enabled: false                   # When True, executes Adam optimization over photometric loss L1 + SSIM
    steps: 5                         # Number of SGD steps per frame (default: 5, set to 0 for pure feedforward)
    lr_color: 0.01                   # Learning rate for RGB/spherical harmonic color
    lr_opacity: 0.05                 # Learning rate for Gaussian opacity
    lambda_ssim: 0.2                 # Weight for SSIM loss (paper Eq. 10: lambda = 0.2)
    prune_opacity_threshold: 0.05    # Opacity threshold below which Gaussians are pruned

  # SE(3) Rigid Object Tracking
  tracking:
    method: "gauss_newton"           # "gauss_newton" (robust point-to-plane Gauss-Newton on a fixed surface model, deterministic) or "recurgs_adam" (RecurGS Lie-algebra Adam refinement on randomly subsampled points)
    # recurgs_adam
    se3_iterations: 12               # Lie algebra gradient optimization iterations per frame
    se3_icp_iterations: 8            # Coarse ICP alignment iterations
    subsample: 256                   # Subsampled points per object (increase to 512/1024 for higher accuracy)
    learning_rate: 0.003             # Step size in se(3) tangent space
    tolerance: 0.0001                # Convergence criterion
    # gauss_newton
    gn_model: "fused"                # Surface model per object, built after the scan: "fused" (scan points on the mesh + mesh where the scan saw nothing), "scan", "mesh"
    gn_model_voxel: 0.003            # Scan points averaged per voxel of this size [m]
    gn_mesh_samples: 20000           # Points sampled on the object mesh
    gn_iterations: 8                 # Gauss-Newton iterations per frame (fewer once every object has converged)
    gn_observation_voxel: 0.004      # Observed points averaged per voxel [m]: same view, same result, whatever the pixel count
    gn_max_distance: 0.01            # Final correspondence gate [m]
    gn_initial_max_distance: 0.05    # First-iteration gate, shrinking by 0.6 per iteration [m]
    gn_huber: 0.003                  # Robust kernel threshold on the point-to-plane residual [m]
    gn_motion_prior: true            # Penalise the motion from the previous pose: directions the view does not constrain (yaw of a cylinder) stay still
    gn_measurement_sigma: 0.003      # Residual scale the motion prior is weighed against [m]
    gn_motion_sigma_rot_deg: 5.0     # Motion prior per update, rotation [deg]
    gn_motion_sigma_trans: 0.02      # Motion prior per update, translation [m]
    gn_motion_retry: 0.003           # An object that moved more than this [m] in its last update is also solved from the constant-velocity prediction (0 disables)
    gn_grid_cell: 0.003              # Cell of the precomputed nearest-model-point grid [m]
    gn_grid_margin: 0.06             # Grid extent beyond the model [m]: farther observations get no correspondence
    gn_photometric: false            # Add the photometric term (model colours vs camera images) in the fine iterations; off in simulation (flat textures, exact masks), meant for real cameras
    gn_photometric_weight: 1.0       # Weight of the photometric term relative to the geometric one
    gn_photometric_sigma: 0.1        # Intensity residual scale (grey level in [0, 1]) the weight is expressed against
    gn_photometric_huber: 0.1        # Robust kernel threshold on the intensity residual
    gn_photometric_depth_tolerance: 0.01 # A model point counts as seen when its depth matches the image depth within this [m]
    gn_photometric_max_points: 2000  # Coloured model points used per object (evenly thinned)
    proximity_search_radius: 0.25    # Bounding sphere search radius around last known position in meters

  # Initial Scan (t=0) Caching (Instant restoration in <0.1s without re-streaming over SSH)
  cache:
    enabled: true                    # When True, attempts instant restore of t=0 scan from disk
    save_on_scan: true               # When True, saves t=0 scan tensors and meshes to disk
    cache_dir: "cache/scene_init"    # Directory where scene_gaussians.pt, tsdf.pt, meshes are stored

# ------------------------------------------------------------------------------
# 3b. Robot Model Calibration (shared by MPC kinematics and Digital Twin robot)
# ------------------------------------------------------------------------------
robot:
  # Robot instance: joint angle offsets, flange -> TCP offset, hand frame rotation (configs/robots/).
  # Keys written here override the profile's.
  profile: "configs/robots/panda_coppelia.yaml"   # Physical arm: configs/robots/panda_real.yaml
  self_check:                        # Model hand pose vs measured hand pose on the first state of each episode
    enabled: true
    max_position_error: 0.003        # [m]
    max_rotation_error_deg: 2.0
    on_failure: "stop"               # "stop": safety stop until the next reset | "warn": log only

# ------------------------------------------------------------------------------
# 4. Digital Twin Engine
# ------------------------------------------------------------------------------
digital_twin:
  engine: "pybullet"                 # Physics engine backend: "pybullet" or "mujoco"
  enable_mjx: false                  # Enable MJX GPU-accelerated parallel rollout bridge for MuJoCo
  gui: true                          # Show native physics visualizer window (GLFW for MuJoCo, OpenGL for PyBullet)

  time_step: 0.002                   # Physics simulation time step in seconds
  urdf_path: "franka_panda/panda.urdf"                      # Calibrated URDF for PyBullet backend (neutral 0,0,0 base)
  mujoco_model_path: "assets/mujoco_menagerie/franka_emika_panda/panda_upstream.xml"  # MuJoCo Menagerie Panda (collision geometry only is used)
  tracking_mode: "constraint"        # "constraint" (6-DoF constraint / MuJoCo mocap-weld), "pd_force", or "teleport"
  constraint_max_force: 300.0        # Maximum force for 6-DoF constraint (N)
  kp_pos: 250.0                      # Proportional gain for PD position tracking (N/m)
  kd_pos: 30.0                       # Derivative gain for PD velocity damping (N*s/m)
  kp_rot: 15.0                       # Proportional gain for PD orientation tracking (N*m/rad)
  kd_rot: 1.5                        # Derivative gain for PD angular velocity damping (N*m*s/rad)
  sim_substeps: 2                    # Micro-steps per simulation step for high contact stability
  obstacle_convex_decomposition: true  # Split obstacle meshes into convex parts (V-HACD) in both twins, otherwise concave shapes collide as their convex hull
  vhacd_resolution: 100000           # V-HACD voxel resolution
  vhacd_concavity: 0.05              # V-HACD max concavity per part (higher = fewer, coarser parts; 0.05 -> ~11 parts, ~5 mm error on the tunnel)

# ------------------------------------------------------------------------------
# 5. Controller (MP-PMPPI / Future GPU MuJoCo Rollouts)
# ------------------------------------------------------------------------------
controller:
  engine: "mp_pmppi"                 # Controller architecture
  frequency_hz: 20.0                 # Control execution and planning frequency (Hz)
  dt: 0.05                           # MPPI prediction time step dt (seconds)
  horizon: 15                        # MPPI prediction horizon H (15 * 0.05s = 0.75s)
  max_joint_velocity: 1.00           # Joint velocity bound [rad/s] shared by rollouts, primitives and the issued command
  max_joint_acc: 2.00                # Joint acceleration saturation limit (rad/s^2); keep >= max_joint_velocity / (horizon * dt) so a full-speed rollout can stop within the horizon
  num_samples_per_planner: 24        # Stochastic samples per MPPI strategy
  top_k: 12                          # Top candidates evaluated by the Judge
  alpha_pos: 1.0                     # Cartesian position tracking weight (Zhou et al. Eq. 27)
  alpha_rot: 0.25                    # Cartesian orientation tracking weight (Zhou et al. Eq. 27)
  convergence_radius_xi: 0.15        # Sparse reward radius xi on dist_joint = ||q - q_des|| [rad] (Eq. 26, 28; not reported in the paper)
  convergence_radius_xi_cart: 0.03   # Sparse reward radius on the Cartesian fallback dist_cart, used when IK fails (Eq. 27)
  approach_funnel_weight: 300.0      # Approach cone cost (extension): straight final descent along the target z-axis (0 disables)
  approach_funnel_activation_radius: 0.15  # Gaussian activation radius of the approach cone around the goal [m]
  approach_cone_half_angle_deg: 30.0 # Approach cone half-angle [deg]
  approach_cone_base_radius: 0.01    # Approach cone radius at the goal [m]
  log_interval_actions: 10           # Telemetry print interval for served control actions (every N actions)
  max_action_age_s: 0.20             # Max age [s] of a solved action that may still be replayed as zero-order hold while the MPC is busy
  debug_dump_dir: "logs/mpc_dumps"   # Saves the MPC solve inputs (robot state, goal, obstacle poses and forecasts) as .npz per action, in a timestamped subfolder ("" disables)
  debug_dump_interval: 1             # Dump every N served actions
  sigma_1: 0.015                     # Inscribed hard safety collision margin [m] (1.5cm physical buffer)
  sigma_2: 0.035                     # Inflation radius [m] - compact buffer calibrated for tabletop precision
  kappa: 120.0                       # Exponential decay slope (Zhou et al. Eq. 21, continuous decay to ~0.09 at sigma_2)
  adaptive_goal_margin: false        # Strict adherence to Zhou et al. Eq. 21 without ad-hoc tapering heuristics
  # Dynamic Collision Evasion Thresholds (TTC / Approach velocity aware)
  evade_min_distance: 0.01           # Min distance threshold to avoid numerical singularities [m]
  evade_max_distance: 0.35           # Max search radius for evasive obstacle tracking [m]
  evade_ttc_threshold: 2.0           # Time-to-Collision threshold to trigger active evasion [s]
  evade_min_speed: 0.03              # Speed threshold to classify obstacle as dynamic [m/s]
  evade_imminent_distance: 0.06      # Immediate physical proximity margin triggering evasion [m]
  evade_retreat_speed: 0.15          # Linear retreat speed for evasive maneuvers [m/s]
  evade_lift_speed: 0.12             # Upward vertical lift component for evade_over [m/s]

# ------------------------------------------------------------------------------
# 5a. Object roles (drema/roles): which objects the robot may touch, grasp and carry
# ------------------------------------------------------------------------------
# Permissions come from the environment (configs/roles_env.yaml: config rules, VLM, human). Only a human may
# relax (TOUCH); CONFIG / VLM may only restrict (AVOID / FRAGILE). Without assignments every object is an obstacle.
# Each mechanism has its own switch; with everything off the server behaves as before the roles existed.
roles:
  enabled: true                      # Master switch: false = every object is an obstacle, nothing is ever held
  verbose: true
  yaw_symmetry: true                 # Tip-frame keyframes may be turned by 180 deg about the gripper axis when easier to reach
  yaw_symmetry_held_limit: 0.03      # While holding, no turn moving the held object more than this [m] unless the kept yaw is unreachable (0 = off)
  permissions:                       # Permissions sent by the environment (roles_env.yaml)
    enabled: true
  touch_exempts_arm: false           # A human TOUCH also lets the arm links (not only hand and fingers) touch the object
  fragile_extra_margin: 0.03         # Extra clearance [m] around FRAGILE objects
  policy_contact:                    # Keyframe policy (PerAct / task keyframes) contact: hand only, active keyframe only
    enabled: true
    on_grasp_keyframes: true         # Gripper commanded closed at the keypose: the hand may enclose the objects there (TARGET)
    on_approach_keyframes: true      # ignore_collisions with the gripper open: the hand may come close to them (NEAR)
    zone_tolerance: 0.035            # Contact zone: objects within this distance [m] of the hand footprint at the keypose (= controller.sigma_2: what the hand would feel in the cost there)
    grip_tolerance: 0.01             # Grasp keyframes: objects within this distance [m] of the space between the fingers -> TARGET
    include_table: true              # The table may enter the contact zone
    near_margin: 0.03                # NEAR (the rest of the zone): hand margin reduced by this [m]
    max_speed: 0.03                  # Objects faster than this [m/s] never enter the zone; moving ones leave it until the next keyframe
    held_contact: false              # A held object may touch every NEAR object, not only its support (see support_contact)
    support_contact:                 # ignore_collisions keyframe with an object held: its supports at the keypose are TARGET for the keyframe
      enabled: true
      include_table: true            # The table may be a support
      tolerance: 0.01                # Support = within zone_tolerance of the held object at the keypose and either brought closer by this [m] over the keyframe (the jar under its lid) or within this at both its start and its end (a lid screwed on); the closest one plus any other within this
    hold_until_clear: true           # An object still touched when the zone changes keeps its TARGET / NEAR policy until the hand is clear of it
    push_contact:                    # ignore_collisions keyframe started with the hand empty: the first object the hand runs into on its way to the keypose may be pushed (TARGET for the keyframe)
      enabled: true
      reach: 0.035                   # Only an object hit within this travel [m] from where the keyframe starts
      step: 0.005                    # Sweep step [m] of the hand footprint along the straight line to the keypose
      tolerance: 0.005               # Hit: footprint within this distance [m] of the object and closer than at the start by as much
    hand_footprint:                  # Franka hand at the keypose TCP: z along the approach, y along the finger opening
      finger_axis_yaw_deg: -45.0     # Finger opening axis vs the EE frame y axis
      palm: {center: [0.0, -0.004, -0.1075], half_extents: [0.032, 0.104, 0.0685]}
      fingers: {center: [0.0, -0.002, -0.034], half_extents: [0.011, 0.067, 0.037]}
      grip: {center: [0.0, -0.002, -0.034], half_extents: [0.011, 0.038, 0.037]}
  grasp:                             # Held state: closed gripper + touchable object at the TCP -> attached in the twin
    enabled: true
    radius: 0.04                     # Max object surface distance [m] from the TCP to attach it
    closed_threshold: 0.9            # Below this the fingers count as closed; wider grasps are detected from the finger motion stopping
    open_threshold: 0.9              # Commanded release completes above this open amount (or once the fingers open 2% from the grasp)
    settle_steps: 3                  # Clients without gripper actuator state: consecutive closed requests before attaching
    empty_threshold: 0.05            # Fingers that stopped closing below this open amount hold nothing
    released_state: true             # A released object stays touchable by the hand until the TCP is release_clearance away
    release_clearance: 0.03          # [m]

# ------------------------------------------------------------------------------
# 5b. Visualization of the MPC imagination (drema/visualization), off by default
# ------------------------------------------------------------------------------
visualization:
  imagination:
    live_overlay: false              # Draws rollouts, plan, ghost arms and forecast obstacles in viser (needs system.viser.enabled)
    live_every_n: 2                  # Redraw the overlay every N served actions
    record_dir: ""                   # Saves imagination frames for the offline video (render_imagination_video.py); "" disables
    record_every_n: 1                # Record every N served actions
    max_rollouts: 40                 # Rollouts kept per frame, spread over greedy / sensitive / mixed / primitives
    ghost_count: 3                   # Ghost arms drawn along the executed plan
