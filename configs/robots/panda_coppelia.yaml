# Panda as modelled by CoppeliaSim/RLBench. Values in the measured joint space of the client and in the flange frame.
name: "panda_coppelia"
# theta_DH = q_measured + offset [rad]: the RLBench joint 4 zero is 3.92 deg off the Franka DH zero
# (fitted on joint axes, joint origins and Panda_tip).
joint_angle_offsets: [0.0, 0.0, 0.0, 0.0683, 0.0, 0.0, 0.0]
# Flange -> TCP translation [m], flange frame: Panda_tip fitted over 41 configurations (0.6 mm mean residual).
tcp_offset: [0.00139, 0.00144, 0.11003]
# Rotation of the hand frame the client reports (Panda_tip) relative to the flange, xyz Euler [deg]. Only checked
# at startup: the server measures it online.
tcp_rotation_xyz_deg: [0.0, 0.0, 135.0]
# Joint limits [rad] and joint speed limits [rad/s] (franka_ros panda joint_limits.yaml)
joint_limits:
  q_min: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
  q_max: [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]
  qd_max: [2.1750, 2.1750, 2.1750, 2.1750, 2.6100, 2.6100, 2.6100]
# Robot model of the digital twin (digital_twin.urdf_path / mujoco_model_path override it)
twin:
  pybullet_urdf: "franka_panda/panda.urdf"
  mujoco_model: "assets/mujoco_menagerie/franka_emika_panda/panda_upstream.xml"
  mujoco_hand_bodies: ["hand", "left_finger", "right_finger"]
