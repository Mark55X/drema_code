# Environment-side object roles (run_coppelia_client.py --roles_config configs/roles_env.yaml).
# Every provider can be switched on/off independently. The server (configs/drema_default.yaml, section roles)
# arbitrates: only HUMAN may relax (TOUCH); CONFIG and VLM may only restrict (AVOID / FRAGILE).
roles:
  enabled: true                      # false: the environment sends no permission at all

  # Names that are never offered to the VLM as scene objects (robot parts, sensors, background)
  exclude_keywords: ["Panda", "workspace", "table", "floor", "wall", "ceiling", "camera", "sensor",
                     "success", "waypoint", "detector", "dummy", "boundary", "spawn"]

  config_provider:                   # Static rules on object names (restrict only)
    enabled: true
    rules: []                        # e.g. [{match: "wine", permission: fragile, extra_margin: 0.05}, {match: "lamp", permission: avoid}]

  human:                             # Operator commands in the client console
    enabled: true                    # 'role <id> <touch|avoid|fragile|clear>' (exact id, no VLM needed)
    use_vlm: true                    # also 'say <text>', grounded by the VLM (needs vlm.enabled)
    min_confidence: 0.7              # Below this a TOUCH from 'say' waits for 'yes'
    confirm_relax: "uncertain"       # "uncertain" (confirm only when not confident or ambiguous) or "always"

  vlm_safety:                        # The VLM looks at the scene and flags objects not to touch (needs vlm.enabled)
    enabled: false
    on_scan: true                    # Run once after the initial scan
    period_s: 0                      # Re-run every N seconds of wall clock while the task is active (0 = never)

  vlm:                               # Optional extra: everything above works without it
    enabled: false                   # Master switch for 'say' and vlm_safety
    backend: "keyword"               # "keyword" (offline, name matching) or "openai_compatible" (vLLM, Ollama /v1, OpenAI)
    base_url: "http://localhost:8000/v1"
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    api_key_env: "OPENAI_API_KEY"    # Environment variable holding the key (empty for local servers)
    timeout_s: 60
    camera: "front"                  # Streaming camera shown to the VLM, with object ids drawn on it
    fragile_name_keywords: []        # keyword backend only: object names flagged FRAGILE by the safety check
