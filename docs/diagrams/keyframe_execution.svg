<text text-anchor="start" x="763" y="-375.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="white">States</text>
<text text-anchor="start" x="809" y="-375.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white"> &#160;client sequencer; the server MPPI</text>
<text text-anchor="start" x="763" y="-363.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">decides how the arm moves</text>
<polygon fill="#cfe2f3" stroke="transparent" points="758,-319 758,-355 827,-355 827,-319 758,-319"/>
<text text-anchor="start" x="772.5" y="-334.9" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">MOVE</text>
<text text-anchor="start" x="832" y="-340.4" font-family="Helvetica,sans-Serif" font-size="12.00">the MPPI tracks the keypose</text>
<text text-anchor="start" x="832" y="-327.4" font-family="Helvetica,sans-Serif" font-size="12.00">(approach cone on grasps)</text>
<polygon fill="#fff2cc" stroke="transparent" points="758,-296 758,-319 827,-319 827,-296 758,-296"/>
<text text-anchor="start" x="767.5" y="-305.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">SETTLE</text>
<text text-anchor="start" x="832" y="-304.4" font-family="Helvetica,sans-Serif" font-size="12.00">wait until the arm stops closing in</text>
<polygon fill="#d9ead3" stroke="transparent" points="758,-273 758,-296 827,-296 827,-273 758,-273"/>
<text text-anchor="start" x="763" y="-282.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">GRIPPER</text>
<text text-anchor="start" x="832" y="-281.4" font-family="Helvetica,sans-Serif" font-size="12.00">close / open, wait for the fingers</text>
<polygon fill="#eeeeee" stroke="transparent" points="758,-250 758,-273 827,-273 827,-250 758,-250"/>
<text text-anchor="start" x="774.5" y="-259.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">NEXT</text>
<text text-anchor="start" x="832" y="-258.4" font-family="Helvetica,sans-Serif" font-size="12.00">the next keyframe becomes active</text>
<polygon fill="#555555" stroke="transparent" points="758,-227 758,-250 1093,-250 1093,-227 758,-227"/>
<text text-anchor="start" x="763" y="-236.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="white">Transitions</text>
<text text-anchor="start" x="763" y="-213.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">free</text>
<text text-anchor="start" x="832" y="-212.4" font-family="Helvetica,sans-Serif" font-size="12.00">free keyframe: within 2 cm</text>
<text text-anchor="start" x="763" y="-183.9" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">contact</text>
<text text-anchor="start" x="832" y="-189.4" font-family="Helvetica,sans-Serif" font-size="12.00">grasp / release: within 1 cm;</text>
<text text-anchor="start" x="832" y="-176.4" font-family="Helvetica,sans-Serif" font-size="12.00">approach pose before them: within 2 cm</text>
<text text-anchor="start" x="763" y="-134.9" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">settled</text>
<text text-anchor="start" x="832" y="-153.4" font-family="Helvetica,sans-Serif" font-size="12.00">within 3 mm, or less than 1 mm closer</text>
<text text-anchor="start" x="832" y="-140.4" font-family="Helvetica,sans-Serif" font-size="12.00">over 10 steps (0.5 s), or 60 steps:</text>
<text text-anchor="start" x="832" y="-127.4" font-family="Helvetica,sans-Serif" font-size="12.00">the gripper acts on a grasp / release,</text>
<text text-anchor="start" x="832" y="-114.4" font-family="Helvetica,sans-Serif" font-size="12.00">an approach pose goes straight to NEXT</text>
<text text-anchor="start" x="763" y="-92.4" font-family="Helvetica,sans-Serif" font-style="italic" font-size="12.00">leaves</text>
<text text-anchor="start" x="832" y="-91.4" font-family="Helvetica,sans-Serif" font-size="12.00">the arm leaves the tolerance while settling</text>
<text text-anchor="start" x="763" y="-69.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">done</text>
<text text-anchor="start" x="832" y="-68.4" font-family="Helvetica,sans-Serif" font-size="12.00">the fingers have stopped</text>
<polygon fill="#555555" stroke="transparent" points="758,-37 758,-60 1093,-60 1093,-37 758,-37"/>
<text text-anchor="start" x="763" y="-46.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="white">Note</text>
<text text-anchor="start" x="763" y="-22.4" font-family="Helvetica,sans-Serif" font-size="12.00">Approach poses are known for demo keyframes only:</text>
<text text-anchor="start" x="763" y="-9.4" font-family="Helvetica,sans-Serif" font-size="12.00">a policy gives one keyframe at a time.</text>
